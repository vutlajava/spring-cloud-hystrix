spring:
  application:
    name: IDENTITY-SERVICE
  config:
    import: configserver:http://localhost:9196
  datasource:
    url: jdbc:mysql://localhost:3306/m_userdb
    username: root
    password: root123
    platform: mysql
  jpa:
    hibernate.ddl-auto: update
server:
  port: 9898

management:
  tracing:
    enabled: true
  zipkin:
    tracing:
      enabled: true
      base-url: http://locahost:9411
logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %5p [${spring.application.name},%X{traceId:-},%X{spanId:-}] %c{1} - %m%n"