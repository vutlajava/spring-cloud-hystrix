spring :
  application :
    name : ORDER-SERVICE
  config:
    import: configserver:http://localhost:9196
  datasource :
   url : jdbc:mysql://localhost:3306/m_orderdb
   username : root
   password : 
   platform : mysql
  jpa :
    hibernate.ddl-auto : update

server:
  port : 9191
logging:
  file: c:/Users/vutla/microservice.log
management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
  logging:
    pattern:
      level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"


